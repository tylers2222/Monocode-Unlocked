[workspace]
resolver = "2"
members = ["src-tauri"]
exclude = ["vendor/portable-pty"]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_lines = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
dbg_macro = "deny"
