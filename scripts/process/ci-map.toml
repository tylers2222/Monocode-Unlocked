# CI path map: the one list of which changed files run which path-gated CI job (ADE-190).
# scripts/process/ci_changes.py reads it in the `changes` jobs of ci.yml and e2e.yml,
# and box-ci.sh reads it through that script.
#
# A glob matches the whole repo-relative path: `*` and `?` stay inside one folder,
# `**` crosses folders (`src/**` is every file under src/).
#
# A pull request runs a job when one of its changed files matches the job's globs.
# Fail safe, every job runs when:
#   - a changed file matches `all`, or matches no glob in this file at all;
#   - the event is not a pull request (a push to main or tyler/main, a dispatch);
#   - the diff cannot be read, or is empty.
# A file that matches only `none` runs no gated job. gate/lint, gate/integrity,
# gate/mutation and review/agent are never gated: they run on every pull request.
#
# The map is refused when it is read (the `changes` job goes red and every job runs) if a
# path in [reach] does not run its job through the job's own globs, or a path in
# `unmatched` matches any glob. That catches a job glob with a typo and a `none` glob that
# is too broad, which would otherwise skip jobs on later pull requests (ADE-301).
#
# This map is one of two filters. scripts/process/ci_level.py is the other: a draft runs
# only the fast set, whatever this map says. See that script.

# Files whose change can affect every job: the workflows a pull request runs, the map and
# its reader, dependency manifests and lockfiles, toolchain pins. A workflow is listed only
# when it runs on pull_request or a pull_request workflow calls it; a pull request does not
# run the others, so they are in `none` (test_ci_changes.WorkflowsInTheMap).
all = [
  ".github/rust-version",
  ".github/workflows/cancel-closed-pr-runs.yml",
  ".github/workflows/ci.yml",
  ".github/workflows/e2e.yml",
  ".github/workflows/gate-mutation.yml",
  ".github/workflows/gate.yml",
  ".github/workflows/native.yml",
  ".github/workflows/stop-useless-runs.yml",
  "scripts/process/ci-map.toml",
  "scripts/process/ci_changes.py",
  "scripts/process/ci_level.py",
  "scripts/process/ci_verdict.py",
  "package.json",
  "package-lock.json",
  "Cargo.toml",
  "Cargo.lock",
  ".nvmrc",
  ".node-version",
  ".tool-versions",
  "rust-toolchain",
  "rust-toolchain.toml",
  ".cargo/**",
  ".npmrc",
]

# Files no gated job reads. The gate scripts and the lint configs are read by gate/lint,
# which always runs; scripts/spaces and the version and SSH helpers are run by no workflow.
# The workflows here never run on pull_request: push, tag, schedule, dispatch, comment and
# workflow_run only, and gate-integrity.yml runs the base branch's copy (pull_request_target).
none = [
  ".github/*.md",
  ".github/ISSUE_TEMPLATE/**",
  ".github/workflows/cache-seed.yml",
  ".github/workflows/fork-sync.yml",
  ".github/workflows/gate-integrity-rerun.yml",
  ".github/workflows/gate-integrity.yml",
  ".github/workflows/native-release.yml",
  ".github/workflows/release.yml",
  "docs/**",
  "*.md",
  "LICENSE",
  "NOTICE",
  ".gitignore",
  "scripts/gate/**",
  "scripts/process/**",
  "scripts/spaces/**",
  "scripts/bump-version.mjs",
  "scripts/test-remote-ssh.py",
  "eslint.config.js",
  "eslint-suppressions.json",
  ".jscpd.json",
]

# New files that no glob lists yet, so they run every job. None of them may exist in the
# repo. A `none` glob that reaches one of them, such as `**`, `*` or `scripts/**`, would
# skip every job for a new file that a job may need.
unmatched = [
  "newtool/config.yaml",
  "new-config.ts",
  "scripts/new-tool.sh",
  "crates/new-crate/src/lib.rs",
  ".github/workflows/new-workflow.yml",
  ".github/actions/new-action/action.yml",
]

# One entry per gated job; the key is the job id and the name of the `changes` output.
[jobs]
# node --test scripts/release-channel.test.cjs
release-channel = [
  "scripts/release-channel*",
  "src-tauri/tauri*.conf.json",
]

# Playwright on Vite: the front end, the specs and their rigs, and host/ (a spec
# imports it).
browser = [
  "src/**",
  "tests/browser/**",
  "host/**",
  "public/**",
  "*.html",
  "playwright.config.ts",
  "vite.config.ts",
  "tsconfig.json",
  "tsconfig.node.json",
]

# The host build and tests: host/ imports src/ models, and its tests read the
# bootstrap scripts in src-tauri.
host = [
  "host/**",
  "src/**",
  "src-tauri/src/remote_bootstrap.*",
  "tsconfig.json",
]

# vitest (src/, tests/), tsc, cargo fmt/clippy/check/test. The
# Rust tests read fixtures in src/ and tests/ and include host/windows-acl.ps1.
check = [
  "src/**",
  "src-tauri/**",
  "crates/mobile-link/**",
  "tests/**",
  "vendor/**",
  "host/windows-acl.ps1",
  "clippy.toml",
  "rustfmt.toml",
  ".rustfmt.toml",
  "tsconfig.json",
  "tsconfig.node.json",
  "vite.config.ts",
  "vitest.config.ts",
  "scripts/process/heavy-lock*",
  "scripts/install-linux-deps-debian.sh",
]

# Fedora and AlmaLinux rpm builds (and the clean install after them).
rpm = [
  "src-tauri/**",
  "crates/mobile-link/**",
  "vendor/**",
  "scripts/repack-appimage.sh",
  "scripts/assert-appimage-host-libs.sh",
  "scripts/install-linux-deps-debian.sh",
  "scripts/install-linux-deps-fedora.sh",
]

# The AppImage host-library assertion: only these inputs change host-library linking.
appimage = [
  "scripts/repack-appimage.sh",
  "scripts/assert-appimage-host-libs.sh",
  "scripts/install-linux-deps-debian.sh",
  "src-tauri/tauri.conf.json",
  "src-tauri/tauri.linux.conf.json",
  "src-tauri/Cargo.toml",
]

# make e2e in the Docker image: the app build, the scenario, milestone and eval suites.
e2e-linux = [
  "src/**",
  "src-tauri/**",
  "crates/mobile-link/**",
  "vendor/**",
  "host/windows-acl.ps1",
  "public/**",
  "*.html",
  "vite.config.ts",
  "tsconfig.json",
  "tsconfig.node.json",
  "tests/scenarios/**",
  "scripts/scenarios/**",
  "scripts/giga-eval/**",
  "scripts/milestones-e2e/**",
  "scripts/install-linux-deps-debian.sh",
  "evals/**",
  "docker/**",
  "Makefile",
]

# The real-app scenarios on a hosted Mac.
e2e-macos = [
  "src/**",
  "src-tauri/**",
  "crates/mobile-link/**",
  "vendor/**",
  "host/windows-acl.ps1",
  "public/**",
  "*.html",
  "vite.config.ts",
  "tsconfig.json",
  "tsconfig.node.json",
  "tests/scenarios/**",
  "scripts/scenarios/**",
  "scripts/giga-eval/**",
  "scripts/milestones-e2e/**",
  "scripts/e2e-macos.sh",
]

# The Expo app's lint, tsc and vitest. Its vitest also runs tests/mobile, which
# imports the desktop's mobile protocol models from src/.
mobile = [
  "mobile/**",
  "tests/mobile/**",
  "src/**",
]

# .github/workflows/native.yml: the GPUI app, its core crates and their scripts.
native = [
  "crates/monocode-core/**",
  "crates/monocode-gpui/**",
  "crates/mobile-link/**",
  "vendor/gpui-pre*/**",
  "scripts/*native*",
  "scripts/native-editor/**",
  "scripts/native-settings/**",
]

# For each job, real files that it must run for through its own globs (not through `all`).
# A job glob with a typo, or one that is dropped, leaves its path here without the job.
[reach]
release-channel = ["scripts/release-channel.test.cjs"]
browser = ["src/app/App.tsx", "tests/browser/ade179-space-switcher.spec.ts"]
host = ["host/engine.ts", "src-tauri/src/remote_bootstrap.sh"]
check = ["src-tauri/src/lib.rs", "scripts/process/heavy-lock.sh"]
rpm = ["src-tauri/src/lib.rs", "scripts/install-linux-deps-fedora.sh"]
appimage = ["scripts/repack-appimage.sh"]
e2e-linux = ["src-tauri/src/lib.rs", "docker/e2e-report.mjs", "evals/promptfooconfig.yaml"]
e2e-macos = ["src-tauri/src/lib.rs", "scripts/e2e-macos.sh"]
mobile = ["mobile/src/app/_layout.tsx", "src/app/App.tsx"]
native = ["crates/monocode-core/src/store.rs", "scripts/native-release.mjs"]
