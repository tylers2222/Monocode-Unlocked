name: gate-integrity

# GitHub runs a pull_request_target workflow from the default branch, and the
# checkout below takes the default branch too, so a pull request cannot edit the
# check that judges it. The branches filter keeps the job to pull requests into
# tyler/main. That is safe only while no step runs pull request code: the PR head
# is fetched as git objects for `git diff` and never checked out, installed, built
# or sourced. The scripts it runs come from the default-branch checkout too.
# A label or body change re-runs the gate: a hand-set tier label is put back, and the
# body and label checks see the new state. NON-INPUT below is the one exception.
#
# NON-INPUT: adding or removing a label on this short list runs nothing, because no gate
# check reads it (scripts/process/tests/test_stop_useless_runs.py). Any other label re-runs
# the gate, so a new label fails safe. github.event.label is empty on every other action, so
# the list never matches them. The jobs of such a run must not keep their required names: a
# skipped required check counts as passed, and it would replace a red gate/integrity. GitHub
# lists a skipped job under the unevaluated name expression, which is not a required name.
on:
  pull_request_target:
    branches: [tyler/main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# One run at a time per head, and an event never cancels a running gate. Its run waits and
# starts after the running one ends, so the last result read the last state; GitHub
# replaces a waiting run with a newer one. A run on an older head reports on that head only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["process-fix", "test-only"]'), github.event.label.name) && github.run_id || github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tier:
    name: ${{ contains(fromJSON('["process-fix", "test-only"]'), github.event.label.name) && 'no gate input changed (tier)' || 'gate/tier' }}
    if: ${{ !contains(fromJSON('["process-fix", "test-only"]'), github.event.label.name) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      nt: ${{ steps.tier.outputs.nt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tier the PR and set its tier label
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/process/tier.py "$PR" --apply

  integrity:
    name: ${{ contains(fromJSON('["process-fix", "test-only"]'), github.event.label.name) && 'no gate input changed' || 'gate/integrity' }}
    needs: tier
    # A skipped required check counts as passed, so this job runs even when
    # gate/tier fails, and its last step fails it. Only NON-INPUT skips it, under another name.
    if: ${{ !cancelled() && !contains(fromJSON('["process-fix", "test-only"]'), github.event.label.name) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      # The workflow file of the head's gate/mutation run: merge_rule.py trusts only
      # .github/workflows/gate-mutation.yml, and a T3 head fails until that run succeeds.
      actions: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GATE_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR head as git objects only
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Integrity check (default-branch script, diff only)
        run: bash scripts/gate/integrity.sh "$BASE_SHA" "$HEAD_SHA"

      # The Actions policy allows pull_request_target only for this file, and any other
      # workflow with it could run PR code with a write token.
      - name: Only gate-integrity.yml uses pull_request_target
        if: ${{ !cancelled() }}
        run: python3 scripts/process/workflow_events.py "$BASE_SHA" "$HEAD_SHA"

      # Each check below reads the PR live, so a re-run sees the current body and labels.
      - name: PR description (size, self-pass, file caps) and tiny-PR overlap warning
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NT: ${{ needs.tier.outputs.nt }}
        run: python3 scripts/process/pr_body.py "$PR" ${NT:+--nt "$NT"}

      # The two label checks come from #164, which merges first. A missing script fails
      # the step, so a check can never be skipped without a red gate/integrity.
      - name: waits-tyler label category
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f scripts/process/waits-tyler.py ]; then
            echo "::error::scripts/process/waits-tyler.py is missing on the default branch; #164 must merge first"
            exit 1
          fi
          python3 scripts/process/waits-tyler.py --pr "$PR" --repo "$GATE_REPO"

      - name: Exactly one instance label
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f scripts/process/instance-label.py ]; then
            echo "::error::scripts/process/instance-label.py is missing on the default branch; #164 must merge first"
            exit 1
          fi
          python3 scripts/process/instance-label.py --pr "$PR" --repo "$GATE_REPO"

      # Fails until the latest review verdict is clean on the head (T3: and a trusted green
      # gate/mutation on it). It only reads; review/agent stays reviewer-only.
      # gate-integrity-rerun.yml re-runs this job when a verdict or another check changes.
      - name: Merge rule (review verdict and fixer proof)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ needs.tier.outputs.tier }}
        run: python3 scripts/process/merge_rule.py "$PR" "$TIER"

      - name: Fail when gate/tier failed
        if: ${{ !cancelled() && needs.tier.result != 'success' }}
        env:
          RESULT: ${{ needs.tier.result }}
        run: |
          echo "integrity: gate/tier ended $RESULT"
          exit 1
