name: gate-integrity

# GitHub runs a pull_request_target workflow from the default branch, and the
# checkout below takes the default branch too, so a pull request cannot edit the
# check that judges it. The branches filter keeps the job to pull requests into
# tyler/main. That is safe only while no step runs pull request code: the PR head
# is fetched as git objects for `git diff` and never checked out, installed, built
# or sourced. The scripts it runs come from the default-branch checkout too.
# A label change re-runs the gate, so a hand-set tier label is put back.
on:
  pull_request_target:
    branches: [tyler/main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier:
    name: gate/tier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      nt: ${{ steps.tier.outputs.nt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tier the PR and set its tier label
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/process/tier.py "$PR" --apply

  # Runs only for tier:T3 and passes at once for T1 and T2. It builds and tests the PR's
  # code, so it has no token permissions, reads no secrets, writes no cache, and runs
  # only for branches of this repository (only collaborators can push them). What it
  # mutates and the pass rule come from the default-branch checkout in gate/.
  mutation:
    name: gate/mutation
    needs: tier
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {}
    env:
      TIER: ${{ needs.tier.outputs.tier }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Not T3, no mutation run
        if: ${{ env.TIER != 'T3' }}
        run: 'echo "mutation: tier $TIER, no mutation run"'

      - name: T3 from a fork
        if: ${{ env.TIER == 'T3' && env.SAME_REPO != 'true' }}
        run: |
          echo "mutation: a T3 PR from a fork cannot run its code here; push the branch to this repository"
          exit 1

      - uses: actions/checkout@v4
        if: ${{ env.TIER == 'T3' && env.SAME_REPO == 'true' }}
        with:
          path: gate
          persist-credentials: false

      - uses: actions/checkout@v4
        if: ${{ env.TIER == 'T3' && env.SAME_REPO == 'true' }}
        with:
          path: head
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Changed lines to mutate
        id: targets
        if: ${{ env.TIER == 'T3' && env.SAME_REPO == 'true' }}
        working-directory: head
        run: |
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff "$merge_base" "$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"
          git diff --unified=0 "$merge_base" "$HEAD_SHA" | python3 ../gate/scripts/process/mutation_targets.py | tee -a "$GITHUB_OUTPUT"

      - id: rust-version
        if: ${{ steps.targets.outputs.rust == 'yes' }}
        run: echo "version=$(cat gate/.github/rust-version)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        if: ${{ steps.targets.outputs.rust == 'yes' }}
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - uses: taiki-e/install-action@v2
        if: ${{ steps.targets.outputs.rust == 'yes' }}
        with:
          tool: cargo-mutants

      - name: cargo mutants on the changed Rust lines
        if: ${{ steps.targets.outputs.rust == 'yes' }}
        working-directory: head
        run: |
          bash ../gate/scripts/install-linux-deps-debian.sh --sources /etc/apt/sources.list.d/ubuntu.sources
          bash ../gate/scripts/process/mutation.sh rust "$RUNNER_TEMP/pr.diff"

      - uses: actions/setup-node@v4
        if: ${{ steps.targets.outputs.stryker != '' }}
        with:
          node-version: 24

      - name: Stryker on the changed TypeScript lines
        if: ${{ steps.targets.outputs.stryker != '' }}
        working-directory: head
        env:
          SPECS: ${{ steps.targets.outputs.stryker }}
        run: bash ../gate/scripts/process/mutation.sh ts "$SPECS"

  integrity:
    name: gate/integrity
    needs: [tier, mutation]
    # A skipped required check counts as passed, so this job runs even when
    # gate/tier or gate/mutation fails, and its last step fails it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      # Only for the carry post below.
      statuses: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      GATE_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR head as git objects only
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Integrity check (default-branch script, diff only)
        run: bash scripts/gate/integrity.sh "$BASE_SHA" "$HEAD_SHA"

      # Each check below reads the PR live, so a re-run sees the current body and labels.
      - name: PR description (size, self-pass, file caps) and tiny-PR overlap warning
        if: ${{ !cancelled() }}
        env:
          NT: ${{ needs.tier.outputs.nt }}
        run: python3 scripts/process/pr_body.py "$PR" --nt "$NT"

      # The two label checks come from PR #164; they run once it is on the default branch.
      - name: waits-tyler label category
        if: ${{ !cancelled() && hashFiles('scripts/process/waits-tyler.py') != '' }}
        run: python3 scripts/process/waits-tyler.py --pr "$PR" --repo "$GATE_REPO"

      - name: Exactly one instance label
        if: ${{ !cancelled() && hashFiles('scripts/process/instance-label.py') != '' }}
        run: python3 scripts/process/instance-label.py --pr "$PR" --repo "$GATE_REPO"

      # Fails until the head may merge under the tier rule: a review verdict on the head,
      # or a minors-only verdict carried by fixer proof. --post-carry posts the carried
      # verdict as review/agent on the head; delete the flag and `statuses: write` to keep
      # review/agent reviewer-only. gate-integrity-rerun.yml re-runs this job when a
      # verdict, a fixer-proof comment or another check changes.
      - name: Merge rule (review verdict and fixer proof)
        if: ${{ !cancelled() }}
        env:
          TIER: ${{ needs.tier.outputs.tier }}
        run: python3 scripts/process/merge_rule.py "$PR" "$TIER" --post-carry

      - name: gate/tier and gate/mutation passed
        if: ${{ !cancelled() && (needs.tier.result != 'success' || needs.mutation.result != 'success') }}
        env:
          TIER_RESULT: ${{ needs.tier.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
        run: |
          echo "integrity: gate/tier ended $TIER_RESULT, gate/mutation ended $MUTATION_RESULT"
          exit 1
