name: E2E

# E2E runs here and never on a developer's machine. e2e-linux runs the suites of
# the Docker image (make e2e); e2e-macos-1 and e2e-macos-2 run the real-app
# scenarios on hosted Macs, half each, on a debug build. e2e-macos-release runs
# them all on a release build, nightly on tyler/main or when a dispatch asks.
# Every agent is the fx puppet: no model, no secrets.
on:
  pull_request:
    # ready_for_review starts the full set on a PR that ran only the fast set as a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [tyler/main]
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        options: [all, browser, milestones, scenarios, evals]
        default: all
      scenario:
        description: One app.sh scenario command line, for example ade89 two; empty runs every scenario
        type: string
        default: ""
      repeat:
        description: Runs of each scenario
        type: number
        default: 1
      scenario_env:
        description: Switches the scenarios read, space-separated NAME=value, for example R6_KEEP_LEAD_LOADED=1
        type: string
        default: ""
      macos_build:
        description: The macOS build the scenarios run on (release runs only e2e-macos-release)
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

# The nightly run has its own group, so a tyler/main push does not cancel it. A push
# has its own group too, so a newer push cancels the older one and no dispatch.
concurrency:
  group: ${{ github.event_name == 'push' && format('e2e-push-{0}', github.ref) || format('{0}-{1}', github.workflow, github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

env:
  SUITE: ${{ inputs.suite || 'all' }}
  SCENARIO: ${{ inputs.scenario }}
  REPEAT: ${{ inputs.repeat || 1 }}
  SCENARIO_ENV: ${{ inputs.scenario_env }}

jobs:
  # The ci.yml changes job, for the two e2e jobs: scripts/process/ci-map.toml decides
  # which of them a pull request runs; a push or a dispatch runs both. Both fail open
  # (see ci.yml): when this job fails, its outputs are empty and both run.
  changes:
    name: Changed paths (e2e)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ci_level.py reads the PR's draft state and labels.
      pull-requests: read
    outputs:
      level: ${{ steps.level.outputs.level }}
      e2e-linux: ${{ steps.paths.outputs.e2e-linux }}
      e2e-macos: ${{ steps.paths.outputs.e2e-macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide which jobs run
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/process/ci_changes.py github "$EVENT" "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

      # Draft or ready: scripts/process/ci_level.py. It also fails this job when the merge
      # ref does not hold the event's head. A separate output from the path decision:
      # merge-when-green.sh reads the path decision's log, and a draft is not a path reason.
      - name: Decide the level (fast on a draft, else full)
        id: level
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/process/ci_level.py "$EVENT" "$DRAFT" "$PR" "$REPO" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  # The suites. The required check is the e2e-linux job below, not this one.
  e2e-linux-run:
    name: e2e-linux run
    needs: changes
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # ci.yml's browser job runs the browser specs headless on a ready PR. Headed
      # in this image, three webkit specs fail on timing (ADE-113, ADE-114,
      # ADE-115), so the browser suite runs here only when a dispatch asks.
      SUITES: ${{ inputs.suite == 'all' && 'browser evals milestones scenarios' || inputs.suite || 'evals milestones scenarios' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The image, its load into Docker and the release build of the milestones
      # suite need more disk than the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The same context make e2e sends (git archive of the commit) and the same
      # tag, so make e2e below finds the image and does not build it again.
      - name: Image context
        id: image
        run: |
          rev=$(git rev-parse HEAD)
          mkdir "$RUNNER_TEMP/e2e-context"
          git archive "$rev" | tar -x -C "$RUNNER_TEMP/e2e-context"
          echo "tag=monocode-e2e:${rev:0:12}" >>"$GITHUB_OUTPUT"

      - name: Build the E2E image (layers cached in the GitHub cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ runner.temp }}/e2e-context
          file: ${{ runner.temp }}/e2e-context/docker/e2e.Dockerfile
          tags: ${{ steps.image.outputs.tag }}
          load: true
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,scope=e2e-image,mode=max

      - name: Run the suites
        run: |
          code=0
          for suite in $SUITES; do make e2e WAIT=1 SUITE="$suite" CPUS=4 MEMORY=12g || code=1; done
          exit "$code"

      - name: Collect the results
        if: always()
        run: for run in e2e-results/*/; do make e2e-status RUN="$(basename "$run")"; done

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-linux-results
          path: e2e-results/
          retention-days: 14
          if-no-files-found: warn

  # Two named jobs, not a matrix: a skipped job keeps its name, so a ruleset can
  # require e2e-macos-1 and e2e-macos-2. scripts/e2e-macos.sh holds the split
  # (E2E_MACOS_SHARD) and fails when a scenario is in no shard or in two.
  e2e-macos-1:
    name: e2e-macos-1
    needs: changes
    if: ${{ false }}
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      GIGA_EVAL_OUT: /tmp/e2e-app
      GIGA_EVAL_HOME: /tmp/e2e-app-home
      # A debug instance: its build takes minutes less than release (instance.sh).
      GIGA_EVAL_DEBUG_BUILD: "1"
      E2E_MACOS_SHARD: "1"
      E2E_CACHE_KEY: e2e-macos-debug
    steps: &e2e-macos-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - id: rust-version
        run: echo "version=$(cat .github/rust-version)" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      # giga-eval builds every instance into $GIGA_EVAL_OUT/target, outside the checkout,
      # so cache that directory. Only tyler/main runs save; pull requests restore.
      # The key names the profile: a release target restores nothing a debug build uses.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          cache-directories: ${{ env.GIGA_EVAL_OUT }}/target
          shared-key: ${{ env.E2E_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/tyler/main' }}

      # The omp release ci.yml installs, checked against its SHA256SUMS.txt.
      - name: Install omp 18.2.11 (sha256-checked release binary)
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 30 --connect-timeout 15 -o "$RUNNER_TEMP/omp" https://github.com/can1357/oh-my-pi/releases/download/v18.2.11/omp-darwin-arm64
          echo "faeffd57674cffa253e2f127d72ddfe6dcd81e1eb91eb5d2148913e62a010a28  $RUNNER_TEMP/omp" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/omp-bin"
          install -m 0755 "$RUNNER_TEMP/omp" "$RUNNER_TEMP/omp-bin/omp"
          echo "$RUNNER_TEMP/omp-bin" >>"$GITHUB_PATH"
      - run: omp --version

      # d4 runs the real Claude Code CLI against a local fake model (no key).
      - name: Install Claude Code 2.1.310
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.310

      # Builds the instance each scenario needs, then runs it on the runner's screen:
      # the scenarios of $E2E_MACOS_SHARD, or all of them when it is unset.
      - name: Run the scenarios
        run: bash scripts/e2e-macos.sh e2e-results/macos "$SUITE" "$SCENARIO" "$REPEAT" "$SCENARIO_ENV"

      - name: Collect the build and app logs
        if: always()
        run: mkdir -p e2e-results/macos/app && cp "$GIGA_EVAL_OUT"/*.log e2e-results/macos/app/ || true

      - name: Upload the results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.job }}-results
          path: e2e-results/
          retention-days: 14
          if-no-files-found: warn

  e2e-macos-2:
    name: e2e-macos-2
    needs: changes
    if: ${{ false }}
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      GIGA_EVAL_OUT: /tmp/e2e-app
      GIGA_EVAL_HOME: /tmp/e2e-app-home
      GIGA_EVAL_DEBUG_BUILD: "1"
      E2E_MACOS_SHARD: "2"
      E2E_CACHE_KEY: e2e-macos-debug
    steps: *e2e-macos-steps

  # The required check. GitHub counts a skipped required check as passed, so this job is
  # never skipped on a pull request: it passes only when every suite passed, or when a
  # suite was skipped for a stated reason. It covers the macOS shards too, which
  # the ruleset does not name. On the fast set it runs under another name, so the required
  # e2e-linux stays absent and a draft's run can never pass it, also when re-run later.
  e2e-linux:
    name: ${{ needs.changes.outputs.level == 'fast' && 'e2e-linux (not run on a draft)' || 'e2e-linux' }}
    needs: [changes, e2e-linux-run, e2e-macos-1, e2e-macos-2]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A suite passes by success, or by a skip with a reason in scripts/process/ci_verdict.py.
      - name: Every suite passed, or was skipped for a stated reason
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          DISPATCH_SKIPS_MACOS: ${{ github.event_name == 'workflow_dispatch' && (inputs.macos_build == 'release' || !contains(fromJSON('["all", "scenarios", "milestones"]'), inputs.suite || 'all')) }}
        run: python3 scripts/process/ci_verdict.py e2e

  # Every scenario on a release build, so an optimised build still runs them
  # before a release ships. Not on pull requests.
  e2e-macos-release:
    name: e2e-macos-release
    if: ${{ (github.event_name == 'schedule' || inputs.macos_build == 'release') && contains(fromJSON('["all", "scenarios", "milestones"]'), inputs.suite || 'all') }}
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      GIGA_EVAL_OUT: /tmp/e2e-app
      GIGA_EVAL_HOME: /tmp/e2e-app-home
      E2E_CACHE_KEY: e2e-macos
    steps: *e2e-macos-steps
