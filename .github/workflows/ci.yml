name: CI

on:
  push:
    branches: [main, tyler/main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  release-channel:
    name: Release channel isolation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/release-channel.test.cjs

  browser:
    # Pinned: on ubuntu-26.04 (the new ubuntu-latest) 11 WebKit real-omp specs time out
    # (tyler/main 93094e67 run 40314640829, PR #361 run 40316396180);
    # the same suite passed on ubuntu-24.04 (runs 40300536386, 40293333880).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Real-harness specs (tests/browser/ade67-question-card.spec.ts) drive a
      # real omp. It is the standalone v18.2.11 release binary, checked against
      # the sha256 in the release's SHA256SUMS.txt; it bundles its dependencies.
      - name: Install omp 18.2.11 (sha256-checked release binary)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/omp" https://github.com/can1357/oh-my-pi/releases/download/v18.2.11/omp-linux-x64
          echo "97cf39557bf3d98327dd4c9814380b7e6bcb76e41169edd9b0ff30424c733a2a  $RUNNER_TEMP/omp" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/omp-bin"
          install -m 0755 "$RUNNER_TEMP/omp" "$RUNNER_TEMP/omp-bin/omp"
          echo "$RUNNER_TEMP/omp-bin" >> "$GITHUB_PATH"
      - run: omp --version
      # list prints each test with its time, so the log shows which specs ran.
      - run: npm run test:browser -- --reporter=list
      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:host
      - run: npm run host:package

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      check: ${{ steps.paths.outputs.check }}
      packaging: ${{ steps.paths.outputs.packaging }}
      appimage: ${{ steps.paths.outputs.appimage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request runs check and the packaging jobs only when their files
      # change; a push or a ci.yml change runs them all. A job whose output is
      # 'false' is skipped at job level and takes no runner. The dependants
      # fail open: their `if:` holds a status function (`!cancelled()`), so
      # they still start when this job fails; its outputs are then empty, and
      # an empty output is not 'false', so they run.
      - name: Decide which jobs run
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # check runs unless every changed file is one it never reads.
          check_skip='^(docs/|[^/]+\.md$|LICENSE$|NOTICE$|scripts/(scenarios|giga-eval|milestones-e2e)/|evals/|docker/|\.github/(ISSUE_TEMPLATE/|[^/]+\.md$|workflows/))'
          packaging_paths='^(src-tauri/|vendor/|Cargo\.(toml|lock)$|package(-lock)?\.json$|scripts/(repack-appimage|assert-appimage-host-libs|install-linux-deps-debian|install-linux-deps-fedora)\.sh$|\.github/workflows/release\.yml$)'
          # The AppImage build keeps its narrower set from before this job: it
          # asserts host-library linking, which only these files can change.
          appimage_paths='^(scripts/(repack-appimage|assert-appimage-host-libs|install-linux-deps-debian)\.sh|package(-lock)?\.json|Cargo\.lock|src-tauri/(tauri(\.linux)?\.conf\.json|Cargo\.toml)|\.github/workflows/release\.yml)$'
          decide() { printf 'check=%s\npackaging=%s\nappimage=%s\n' "$1" "$2" "$3" | tee -a "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = pull_request ] || decide true true true
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || decide true true true
          changed="$(git -c core.quotePath=false diff --name-only --no-renames "$BASE" "$HEAD")"
          printf '%s\n' "$changed"
          grep -qx '\.github/workflows/ci\.yml' <<<"$changed" && decide true true true
          check=false
          packaging=false
          appimage=false
          grep -Evq "$check_skip" <<<"$changed" && check=true
          grep -Eq "$packaging_paths" <<<"$changed" && packaging=true
          grep -Eq "$appimage_paths" <<<"$changed" && appimage=true
          decide "$check" "$packaging" "$appimage"

  check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.check != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/process/heavy-lock.test.sh

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps-debian.sh --sources /etc/apt/sources.list.d/ubuntu.sources

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Same pinned version as gate/lint: clippy here checks the same baseline
      # #[expect] markers, three of them only on macOS or Windows.
      - id: rust-version
        shell: bash
        run: echo "version=$(cat .github/rust-version)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: rustfmt, clippy

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check
      - run: cargo test

  appimage:
    name: AppImage host libraries
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.appimage != 'false' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    # A full tauri release build is too expensive for every PR. Run when
    # its packaging inputs change; the release linux job still always asserts.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-deps-debian.sh

      - run: npm ci

      - name: Build Linux packages
        run: npm run build:linux

      - name: Assert AppImage uses host libraries
        run: bash scripts/assert-appimage-host-libs.sh

  rpm:
    name: RPM build (${{ matrix.image }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.packaging != 'false' }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # almalinux:10 covers the Enterprise Linux path in
        # scripts/install-linux-deps-fedora.sh (EPEL 10 + CRB), which is the
        # only way to catch packages that are missing from EPEL 10.
        image: [fedora:43, almalinux:10]
    steps:
      # librepo fails with "All mirrors were tried" when the mirror set from one
      # metalink fetch is bad. dnf does not fetch the metalink again within a
      # run, but a new dnf run does, and it usually gets working mirrors.
      - &dnf-retry
        name: Wrap every dnf call in the job with retries
        run: |
          cat > /usr/local/bin/dnf <<'EOF'
          #!/bin/sh
          for delay in 15 30 60; do
            /usr/bin/dnf "$@" && exit 0
            echo "dnf failed, retrying in ${delay}s" >&2
            sleep "$delay"
          done
          exec /usr/bin/dnf "$@"
          EOF
          chmod +x /usr/local/bin/dnf

      # Neither fedora:43 nor almalinux:10 ships git, which actions/checkout
      # otherwise has to work around with a REST API tarball download.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: bash scripts/install-linux-deps-fedora.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run build:fedora

      - name: Install the generated rpm
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(target/release/bundle/rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          # tauri-bundler derives rpm Requires only from
          # bundle.linux.rpm.depends, so assert the runtime stack is declared.
          # The install below cannot prove this on its own: the setup script has
          # already installed every -devel package.
          requires="$(rpm -qp --requires "${bundle[0]}")"
          echo "$requires"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3 librsvg2 openssl-libs; do
            if ! grep -qx "$dep" <<<"$requires"; then
              echo "rpm is missing Requires: $dep" >&2
              exit 1
            fi
          done
          dnf install -y "${bundle[0]}"
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          command -v monocode

      - name: Upload rpm for the clean install check
        # Ship and test the EL 10 build. Fedora 43's glibc is newer, so a
        # fedora:43 rpm can dnf-install on AlmaLinux 10 and still fail to load.
        if: matrix.image == 'almalinux:10'
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  rpm-clean-install:
    name: Clean rpm install
    needs: rpm
    # Runs when rpm passed. The status function keeps a failed `changes` job
    # (an ancestor through rpm) from skipping it.
    if: ${{ !cancelled() && needs.rpm.result == 'success' }}
    runs-on: ubuntu-latest
    # Deliberately no setup script: this is the only job that can catch an rpm
    # whose Requires are missing, since everywhere else the -devel packages are
    # already installed. It mirrors the README instructions for an EL 10 user.
    # ldd -r is the loader check: dnf install succeeding does not prove the
    # binary can resolve against EL 10's glibc and runtime libraries.
    container: almalinux:10
    steps:
      - *dnf-retry

      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable EPEL 10
        run: dnf install -y epel-release

      - uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: rpm

      - name: Install the rpm on a clean image
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          dnf install -y "${bundle[0]}"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3; do
            rpm -q "$dep" >/dev/null || { echo "dnf did not install $dep" >&2; exit 1; }
          done
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          test -x /usr/bin/monocode
          # ldd -r can exit non-zero on GTK/WebKit plugin symbols; fail only
          # when a library or GLIBC version is actually missing.
          loader_output="$(ldd -r /usr/bin/monocode 2>&1 || true)"
          printf '%s\n' "$loader_output"
          if grep -q 'not found' <<<"$loader_output"; then
            echo "monocode cannot load on EL 10" >&2
            exit 1
          fi
