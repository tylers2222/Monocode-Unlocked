name: CI

on:
  push:
    branches: [main, tyler/main]
  pull_request:
    # ready_for_review starts the full set on a PR that ran only the fast set as a draft.
    types: [opened, synchronize, reopened, ready_for_review]

# A push gets one group per branch, so a newer push cancels the older run.
concurrency:
  group: ${{ github.event_name == 'push' && format('ci-push-{0}', github.ref) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mobile != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npx vitest run --config mobile/vitest.config.ts

  browser:
    # Pinned: on ubuntu-26.04 (the new ubuntu-latest) 11 WebKit real-omp specs time out
    # (tyler/main 93094e67 run 40314640829, PR #361 run 40316396180);
    # the same suite passed on ubuntu-24.04 (runs 40300536386, 40293333880).
    runs-on: ubuntu-24.04
    # The suite runs one test at a time (playwright.config.ts workers: 1), so it
    # is split by spec file across runners. Each shard is its own runner, so specs
    # that share state still never run side by side. Playwright cuts the file list
    # into blocks of equal test count, not equal time, so the slow real-omp specs
    # near the start make shard 1 the long pole (PR #415 run 40834837758). The
    # saves below run on shard 1 only, so the shards do not race to write one key.
    name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    # Full set only (scripts/process/ci_level.py).
    if: ${{ !cancelled() && needs.changes.outputs.level != 'fast' && needs.changes.outputs.browser != 'false' }}
    strategy:
      # A pull request stops at the first red leg; a push runs every leg, so main-red lists all.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # The browser builds and the apt package list depend only on the OS image
      # and the exact playwright-core version, so a Playwright bump makes new
      # keys and a miss. apt downloads its .deb files into a runner-owned folder,
      # so the cache can save them; dpkg still unpacks and configures each one.
      - name: Playwright cache keys and apt archive folder
        id: playwright
        run: |
          set -euo pipefail
          version="$(jq -er '.packages["node_modules/playwright-core"].version' package-lock.json)"
          echo "key=playwright-$ImageOS-$RUNNER_ARCH-$version" >> "$GITHUB_OUTPUT"
          echo "apt-key=apt-$ImageOS-$RUNNER_ARCH-$version" >> "$GITHUB_OUTPUT"
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/apt-archives" \
            | sudo tee /etc/apt/apt.conf.d/99ci-archives
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      # Only the .deb files: apt's root-only lock and partial/ stay out.
      - name: Restore apt archives
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.playwright.outputs.apt-key }}
      # A browser hit needs no install. A package hit installs the cached .deb files with
      # dpkg: the hosted image lacks all 181 packages, some of them fonts and gstreamer
      # plugins that ldd cannot see, so an ldd check alone would never skip this. dpkg skips
      # apt-get update and the resolver. Any dpkg failure or library that ldd still misses
      # falls back to apt, which repairs the half-installed state. apt writes .deb files
      # as root, so hand them to the runner for the save.
      - name: Install Playwright browsers and system libraries
        env:
          BROWSERS_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
          DEBS_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          missing_libs() {
            find ~/.cache/ms-playwright -type f \( -name chrome -o -name MiniBrowser \) | while read -r bin; do
              dir=$(dirname "$bin")
              LD_LIBRARY_PATH="$dir:$dir/../lib:$dir/../sys/lib" ldd "$bin" | grep 'not found' || true
            done
          }
          if [ "$BROWSERS_HIT" != true ]; then npx playwright install chromium webkit; fi
          sudo rm -f /var/lib/man-db/auto-update
          if [ "$DEBS_HIT" = true ] && sudo dpkg -i --force-unsafe-io ~/apt-archives/*.deb > "$RUNNER_TEMP/dpkg.log" 2>&1; then
            missing=$(missing_libs)
            if [ -z "$missing" ]; then echo "Installed the cached packages with dpkg"; exit 0; fi
            echo "ldd still misses: $missing"
          elif [ "$DEBS_HIT" = true ]; then
            tail -n 20 "$RUNNER_TEMP/dpkg.log"
          fi
          echo "Falling back to apt"
          sudo apt-get update -qq
          sudo apt-get -f install -y
          npx playwright install-deps chromium webkit
          sudo chown -R "$USER" ~/apt-archives
      # Saved right after the download, so a failing test run still fills them.
      - name: Save Playwright browsers
        if: matrix.shard == 1 && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      - name: Save apt archives
        if: matrix.shard == 1 && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.playwright.outputs.apt-key }}
      # Real-harness specs (tests/browser/ade67-question-card.spec.ts) drive a
      # real omp. It is the standalone v18.2.11 release binary, checked against
      # the sha256 in the release's SHA256SUMS.txt; it bundles its dependencies.
      - name: Install omp 18.2.11 (sha256-checked release binary)
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 30 --connect-timeout 15 -o "$RUNNER_TEMP/omp" https://github.com/can1357/oh-my-pi/releases/download/v18.2.11/omp-linux-x64
          echo "97cf39557bf3d98327dd4c9814380b7e6bcb76e41169edd9b0ff30424c733a2a  $RUNNER_TEMP/omp" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/omp-bin"
          install -m 0755 "$RUNNER_TEMP/omp" "$RUNNER_TEMP/omp-bin/omp"
          echo "$RUNNER_TEMP/omp-bin" >> "$GITHUB_PATH"
      - run: omp --version
      # list prints each test with its time, so the log shows which specs ran.
      - run: npm run test:browser -- --reporter=list --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  host:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.host != 'false' }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        # Pull requests run ubuntu only; the macOS leg runs after the merge (a
        # push), and a red one opens the "tyler/main CI red" issue.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run test:host
      - run: node --test host/runtime-download.test.mjs
      - name: Cache pinned host runtimes
        uses: actions/cache@v4
        with:
          path: build/host-runtime-cache
          key: host-runtime-v1-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('host/package.mjs') }}
      - run: npm run host:package

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ci_level.py reads the PR's draft state and labels.
      pull-requests: read
    outputs:
      level: ${{ steps.level.outputs.level }}
      release-channel: ${{ steps.paths.outputs.release-channel }}
      browser: ${{ steps.paths.outputs.browser }}
      host: ${{ steps.paths.outputs.host }}
      check: ${{ steps.paths.outputs.check }}
      rpm: ${{ steps.paths.outputs.rpm }}
      appimage: ${{ steps.paths.outputs.appimage }}
      mobile: ${{ steps.paths.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its parents, to diff the PR; only the map and its script
          # as files. A diff that cannot be read runs every job (ci_changes.py).
          fetch-depth: 2
          sparse-checkout: scripts/process
          persist-credentials: false

      # scripts/process/ci-map.toml decides which jobs a pull request runs; a push runs
      # them all. A job whose output is 'false' is skipped at job level and takes no
      # runner. The jobs fail open: their `if:` holds a status function (`!cancelled()`),
      # so they still start when this job fails; its outputs are then empty, and an
      # empty output is not 'false', so they run.
      - name: Decide which jobs run
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/process/ci_changes.py github "$EVENT" "$HEAD" | tee -a "$GITHUB_OUTPUT"

      # Draft or ready: scripts/process/ci_level.py. It also fails this job when the merge
      # ref does not hold the event's head. A separate output from the path decision:
      # merge-when-green.sh reads the path decision's log, and a draft is not a path reason.
      - name: Decide the level (fast on a draft, else full)
        id: level
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/process/ci_level.py "$EVENT" "$DRAFT" "$PR" "$REPO" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  # The ubuntu leg also runs the release-channel test, so a release-channel change
  # alone runs this job.
  check:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.check != 'false' || needs.changes.outputs.release-channel != 'false') }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        # The macOS leg is in the full set only. Windows is not a supported
        # platform (2026-11-10), so no leg runs there.
        os: ${{ github.event_name == 'push' && fromJSON('["macos-latest", "ubuntu-latest"]') || needs.changes.outputs.level == 'fast' && fromJSON('["ubuntu-latest"]') || fromJSON('["macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps-debian.sh --sources /etc/apt/sources.list.d/ubuntu.sources

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Same pinned version as gate/lint: clippy here checks the same baseline
      # #[expect] markers, some of them only on macOS (CI no longer builds the
      # Windows-only ones).
      - id: rust-version
        shell: bash
        run: echo "version=$(cat .github/rust-version)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: rustfmt, clippy

      # One cache entry per job kind and image (rust-cache adds the OS and arch, the
      # rustc version and the Cargo.lock hash to the key). Only tyler/main pushes save,
      # so pull requests restore the main entry and do not fill the 10 GB repo cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          shared-key: check-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/tyler/main' }}

      - run: npm ci --prefer-offline --no-audit --no-fund
      # The real srt for scenario::logins::*_under_the_real_srt
      # (ADE-224), the version agent_sandbox.rs pins.
      - run: npm install -g @anthropic-ai/sandbox-runtime@0.0.81
        if: runner.os == 'macOS'
      # vitest and tsc do not depend on the OS, so macOS skips them.
      - run: npm test
        if: runner.os != 'macOS'
      - run: npx tsc --noEmit
        if: runner.os == 'Linux'
      # Its own job before, so a red npm test or tsc must not hide its result.
      - run: node --test scripts/release-channel.test.cjs
        if: ${{ !cancelled() && runner.os == 'Linux' }}
      - run: cargo fmt --check
      # On a pull request gate/lint runs this same clippy on ubuntu, so this leg skips
      # it. A tyler/main push still runs it, to save it in the cache gate/lint restores.
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: runner.os != 'Linux' || github.event_name != 'pull_request'
      - run: cargo test
      # The two real-srt login tests, once the suite has ended. Their session runs
      # under the agents' disk throttle, so the suite's disk work stalls it (ADE-313).
      # A filter that matches nothing passes, so the count is checked.
      - run: |
          cargo test -p monocode --lib -- --ignored under_the_real_srt | tee "$RUNNER_TEMP/real-srt.log"
          grep -q "test result: ok. 2 passed" "$RUNNER_TEMP/real-srt.log"
        if: runner.os == 'macOS'

  appimage:
    name: AppImage host libraries
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'push' && needs.changes.outputs.appimage != 'false' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    # A full tauri release build is too expensive for every PR, so packaging runs
    # after the merge only; the release linux job still always asserts.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          shared-key: appimage-ubuntu-22.04
          save-if: ${{ github.ref == 'refs/heads/tyler/main' }}

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-deps-debian.sh

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Linux packages
        run: npm run build:linux

      - name: Assert AppImage uses host libraries
        run: bash scripts/assert-appimage-host-libs.sh

  rpm:
    name: RPM build (${{ matrix.image }})
    needs: changes
    # After the merge only, like appimage; rpm-clean-install follows it.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.changes.outputs.rpm != 'false' }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # almalinux:10 covers the Enterprise Linux path in
        # scripts/install-linux-deps-fedora.sh (EPEL 10 + CRB), which is the
        # only way to catch packages that are missing from EPEL 10.
        image: [fedora:43, almalinux:10]
    steps:
      # librepo fails with "All mirrors were tried" when the mirror set from one
      # metalink fetch is bad. dnf does not fetch the metalink again within a
      # run, but a new dnf run does, and it usually gets working mirrors.
      - &dnf-retry
        name: Wrap every dnf call in the job with retries
        run: |
          cat > /usr/local/bin/dnf <<'EOF'
          #!/bin/sh
          for delay in 15 30 60; do
            /usr/bin/dnf "$@" && exit 0
            echo "dnf failed, retrying in ${delay}s" >&2
            sleep "$delay"
          done
          exec /usr/bin/dnf "$@"
          EOF
          chmod +x /usr/local/bin/dnf

      # Neither fedora:43 nor almalinux:10 ships git, which actions/checkout
      # otherwise has to work around with a REST API tarball download.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: bash scripts/install-linux-deps-fedora.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          shared-key: rpm-${{ matrix.image }}
          save-if: ${{ github.ref == 'refs/heads/tyler/main' }}

      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build:fedora

      - name: Install the generated rpm
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(target/release/bundle/rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          # tauri-bundler derives rpm Requires only from
          # bundle.linux.rpm.depends, so assert the runtime stack is declared.
          # The install below cannot prove this on its own: the setup script has
          # already installed every -devel package.
          requires="$(rpm -qp --requires "${bundle[0]}")"
          echo "$requires"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3 librsvg2 openssl-libs; do
            if ! grep -qx "$dep" <<<"$requires"; then
              echo "rpm is missing Requires: $dep" >&2
              exit 1
            fi
          done
          dnf install -y "${bundle[0]}"
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          command -v monocode

      - name: Upload rpm for the clean install check
        # Ship and test the EL 10 build. Fedora 43's glibc is newer, so a
        # fedora:43 rpm can dnf-install on AlmaLinux 10 and still fail to load.
        if: matrix.image == 'almalinux:10'
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  rpm-clean-install:
    name: Clean rpm install
    needs: rpm
    # Runs when rpm passed. The status function keeps a failed `changes` job
    # (an ancestor through rpm) from skipping it.
    if: ${{ !cancelled() && needs.rpm.result == 'success' }}
    runs-on: ubuntu-latest
    # Deliberately no setup script: this is the only job that can catch an rpm
    # whose Requires are missing, since everywhere else the -devel packages are
    # already installed. It mirrors the README instructions for an EL 10 user.
    # ldd -r is the loader check: dnf install succeeding does not prove the
    # binary can resolve against EL 10's glibc and runtime libraries.
    container: almalinux:10
    steps:
      - *dnf-retry

      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable EPEL 10
        run: dnf install -y epel-release

      - uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: rpm

      - name: Install the rpm on a clean image
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          dnf install -y "${bundle[0]}"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3; do
            rpm -q "$dep" >/dev/null || { echo "dnf did not install $dep" >&2; exit 1; }
          done
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          test -x /usr/bin/monocode
          # ldd -r can exit non-zero on GTK/WebKit plugin symbols; fail only
          # when a library or GLIBC version is actually missing.
          loader_output="$(ldd -r /usr/bin/monocode 2>&1 || true)"
          printf '%s\n' "$loader_output"
          if grep -q 'not found' <<<"$loader_output"; then
            echo "monocode cannot load on EL 10" >&2
            exit 1
          fi

  # The one check for the ruleset: a matrix job that is skipped never reports its
  # per-leg name, so a required leg would leave a PR pending. Keep the name `ci`.
  # On the fast set it runs under another name, so the required `ci` stays absent and a
  # draft's run can never pass it, also when that run is re-run later.
  ci:
    name: ${{ needs.changes.outputs.level == 'fast' && 'ci (fast)' || 'ci' }}
    needs: [changes, mobile, browser, host, check, appimage, rpm, rpm-clean-install]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.results.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A job passes by success, or by a skip with a reason in scripts/process/ci_verdict.py.
      - name: Every job passed, or was skipped for a stated reason
        id: results
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 scripts/process/ci_verdict.py ci | tee -a "$GITHUB_OUTPUT"

  # A red job under `ci` on a pull request ends the other runs of this head. These jobs
  # are not in the needs of `ci`: they report nothing to it, and a skipped one takes no runner.
  stop-mobile:
    name: stop (mobile)
    needs: mobile
    if: ${{ failure() && github.event_name == 'pull_request' }}
    permissions:
      actions: write
    uses: ./.github/workflows/stop-useless-runs.yml

  stop-browser:
    name: stop (browser)
    needs: browser
    if: ${{ failure() && github.event_name == 'pull_request' }}
    permissions:
      actions: write
    uses: ./.github/workflows/stop-useless-runs.yml

  stop-host:
    name: stop (host)
    needs: host
    if: ${{ failure() && github.event_name == 'pull_request' }}
    permissions:
      actions: write
    uses: ./.github/workflows/stop-useless-runs.yml

  stop-check:
    name: stop (check)
    needs: check
    if: ${{ failure() && github.event_name == 'pull_request' }}
    permissions:
      actions: write
    uses: ./.github/workflows/stop-useless-runs.yml

  # Pull requests skip the host macOS and packaging legs, so a break there
  # first shows on tyler/main. One open issue tracks it; the next green run closes it.
  # A cancelled run says nothing about the code, so it leaves the issue as it is.
  main-red:
    name: Report tyler/main CI red
    needs: ci
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/tyler/main' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: tyler/main CI red
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the issue
        if: needs.ci.result != 'success'
        env:
          FAILED: ${{ needs.ci.outputs.failed }}
        run: |
          set -euo pipefail
          {
            echo "CI on tyler/main \`$GITHUB_SHA\` failed: ${FAILED:-the ci job itself}."
            echo
            echo "Run: $RUN_URL"
          } > body.md
          # REST, not `gh issue`: GraphQL createIssue rejects GITHUB_TOKEN (fork-sync.yml).
          issues="repos/$GITHUB_REPOSITORY/issues"
          # --paginate: the repo has more than 100 open issues and PRs.
          numbers=$(gh api --paginate "$issues?state=open&per_page=100" --jq ".[] | select(.title == \"$TITLE\" and (has(\"pull_request\") | not)) | .number")
          number=$(sed -n 1p <<<"$numbers")
          if [ -n "$number" ]; then
            gh api "$issues/$number/comments" -F body=@body.md --jq .html_url
          else
            gh api "$issues" -f title="$TITLE" -F body=@body.md --jq .html_url
          fi

      - name: Close the issue
        if: needs.ci.result == 'success'
        run: |
          set -euo pipefail
          issues="repos/$GITHUB_REPOSITORY/issues"
          for number in $(gh api --paginate "$issues?state=open&per_page=100" --jq ".[] | select(.title == \"$TITLE\" and (has(\"pull_request\") | not)) | .number"); do
            gh api "$issues/$number/comments" -f body="Fixed: CI is green on \`$GITHUB_SHA\` in $RUN_URL" --jq .html_url
            gh api -X PATCH "$issues/$number" -f state=closed --jq .state
          done
