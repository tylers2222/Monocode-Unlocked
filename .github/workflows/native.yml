name: Monocode Native Preview

on:
  push:
    branches: [main, mc/migrate-monocode-to-gpui]
  workflow_dispatch:
  pull_request:
    # ready_for_review starts the full set on a PR that ran only the fast set as a draft.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The ci.yml changes job, for the native jobs: scripts/process/ci-map.toml decides
  # whether a pull request runs them; a push or a dispatch runs them. They fail open
  # (see ci.yml): when this job fails, its outputs are empty and they run.
  changes:
    name: Changed paths (native)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ci_level.py reads the PR's draft state and labels.
      pull-requests: read
    outputs:
      level: ${{ steps.level.outputs.level }}
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide which jobs run
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/process/ci_changes.py github "$EVENT" "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

      # Draft or ready: scripts/process/ci_level.py. It also fails this job when the merge
      # ref does not hold the event's head. A separate output from the path decision:
      # merge-when-green.sh reads the path decision's log, and a draft is not a path reason.
      - name: Decide the level (fast on a draft, else full)
        id: level
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/process/ci_level.py "$EVENT" "$DRAFT" "$PR" "$REPO" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  core:
    name: Core (${{ matrix.os }})
    needs: changes
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        # The macOS and Windows legs are in the full set only.
        os: ${{ needs.changes.outputs.level == 'fast' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux core dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config
      - run: npm run native:test:dev
      - run: cargo clippy --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core --all-targets --profile native-dev -- -D warnings
      - run: cargo test --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core --profile native-dev

  desktop:
    name: Monocode Native (macOS)
    needs: changes
    # Full set only (scripts/process/ci_level.py).
    if: ${{ false }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path crates/monocode-gpui/Cargo.toml --all --check
      - run: cargo clippy --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core -p monocode-gpui --all-targets --profile native-dev -- -D warnings
      - run: cargo test --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core --profile native-dev
      - run: cargo test --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-gpui --profile native-dev -- --test-threads=1
      - run: cargo build --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-gpui --profile native-dev

